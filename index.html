
<!DOCTYPE html>
<html lang="en">

<head>

    <title>WordQuest - The Sentence Adventure</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Main WordQuest Landing Page -->
    <main class="home">

        <!-- Game Logo -->
        <section class="hero">

            <div class="logo">
                <span>✨</span>
