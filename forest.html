<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WordQuest - Word Forest</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- Animated Background -->
    <div class="background-elements" aria-hidden="true">

        <div class="cloud cloud-one">☁️</div>
        <div class="cloud cloud-two">☁️</div>
        <div class="cloud cloud-three">☁️</div>

        <div class="star star-one">⭐</div>
        <div class="star star-two">✨</div>
        <div class="star star-three">⭐</div>
        <div class="star star-four">✨</div>

    </div>

    <!-- =========================================
         WORD FOREST
         ========================================= -->

    <main class="home">

        <section class="hero">


            <!-- TITLE -->

            <h1>
                🌳 Word Forest
            </h1>


            <h2>
                The Sentence Challenge
            </h2>


            <!-- LUMI -->

            <div class="character">
                🐉
            </div>


            <!-- MESSAGE -->

            <div class="character-message">

                <p>
                    Welcome to the Word Forest! 🌲<br>

                    Let's build some amazing sentences!
                </p>

            </div>


            <!-- GAME AREA -->

            <div class="character-message">

                <p>
                    🎮 Your first challenge is coming soon!
                </p>

            </div>


            <!-- BACK BUTTON -->

            <div class="menu">

                <a
                    href="map.html"
                    class="menu-button"
                >
                    🗺️ Back to Map
                </a>


                <a
                    href="index.html"
                    class="menu-button"
                >
                    🏠 Home
                </a>

            </div>

        </section>

    </main>


</body>

</html>
