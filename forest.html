<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WordQuest - Word Forest</title>

    <link rel="stylesheet" href="./css/style.css">

    <style>
        /* =========================================
           GAME SCREEN
           ========================================= */

        .game-page {
            min-height: 100vh;
            padding: 25px 20px 50px;
            text-align: center;
        }

        .game-header {
            max-width: 800px;
            margin: 0 auto 20px;
        }

        .game-header h1 {
            color: #394867;
            margin-bottom: 5px;
        }

        .game-header p {
            color: #59677c;
            font-weight: bold;
        }

        /* =========================================
           GAME INFORMATION
           ========================================= */

        .game-info {
            max-width: 700px;
            margin: 20px auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .info-box {
            background: white;
            padding: 12px 18px;
            border-radius: 15px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.12);

            font-weight: bold;
        }

        /* =========================================
           LIVES
           ========================================= */

        .lives {
            font-size: 25px;
            letter-spacing: 3px;
        }

        /* =========================================
           PROGRESS
           ========================================= */

        .progress-container {
            max-width: 700px;
            height: 15px;

            margin: 20px auto;

            background: rgba(255, 255, 255, 0.7);

            border-radius: 20px;

            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 20%;

            background: #ffcf4a;

            border-radius: 20px;

            transition: width 0.4s ease;
        }

        /* =========================================
           QUESTION CARD
           ========================================= */

        .question-card {
            max-width: 750px;

            margin: 30px auto;

            background: rgba(255, 255, 255, 0.95);

            padding: 30px;

            border-radius: 30px;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.15);
        }

        .question-number {
            color: #718096;
            font-weight: bold;
        }

        .question-card h2 {
            color: #394867;
            line-height: 1.4;
        }

        /* =========================================
           WORD AREA
           ========================================= */

        .word-area {
            min-height: 70px;

            margin: 25px 0;

            padding: 15px;

            border: 3px dashed #b7c2d6;

            border-radius: 20px;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .word-button {
            border: none;

            background: #eef3ff;

            color: #394867;

            padding: 12px 17px;

            border-radius: 14px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            box-shadow: 0 4px 0 #cbd5e7;

            transition: 0.2s;
        }

        .word-button:hover {
            transform: translateY(-3px);
        }

        .word-button.selected {
            background: #ffcf4a;

            color: #4a3510;
        }

        /* =========================================
           BUTTONS
           ========================================= */

        .game-button {
            border: none;

            padding: 14px 25px;

            border-radius: 16px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin: 5px;

            transition: 0.2s;
        }

        .check-button {
            background: #76d275;
            color: white;
        }

        .reset-button {
            background: #eef1f6;
            color: #394867;
        }

        .home-button {
            background: white;
            color: #394867;
        }

        .game-button:hover {
            transform: translateY(-3px);
        }

        /* =========================================
           FEEDBACK
           ========================================= */

        .feedback {
            min-height: 30px;

            margin: 15px;

            font-size: 18px;

            font-weight: bold;
        }

        .correct {
            color: #31934f;
        }

        .wrong {
            color: #d94a4a;
        }

        /* =========================================
           GAME OVER / LEVEL COMPLETE
           ========================================= */

        .result-screen {
            display: none;

            max-width: 600px;

            margin: 40px auto;

            background: white;

            padding: 40px 25px;

            border-radius: 30px;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.15);
        }

        .result-screen.show {
            display: block;
        }

        .result-screen h2 {
            font-size: 35px;
            color: #394867;
        }

        .result-emoji {
            font-size: 75px;
        }

        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 600px) {

            .game-page {
                padding: 20px 12px;
            }

            .question-card {
                padding: 20px 15px;
            }

            .game-info {
                justify-content: center;
            }

            .word-button {
                font-size: 15px;
                padding: 10px 13px;
            }

        }
    </style>

</head>


<body>


    <main class="game-page">


        <!-- =====================================
             HEADER
             ===================================== -->

        <header class="game-header">

            <h1>🌲 Word Forest</h1>

            <p>
                Welcome to the Word Forest! Let's build some amazing sentences!
            </p>

        </header>


        <!-- =====================================
             GAME INFORMATION
             ===================================== -->

        <section class="game-info">

            <div class="info-box">
                🏠 Level <span id="levelNumber">1</span>
            </div>

            <div class="info-box">
                🧩 Question
                <span id="questionNumber">1</span>/5
            </div>

            <div class="info-box lives">
                <span id="lives">❤️❤️❤️</span>
            </div>

            <div class="info-box">
                ⭐ XP:
                <span id="xp">0</span>
            </div>

        </section>


        <!-- =====================================
             PROGRESS BAR
             ===================================== -->

        <div class="progress-container">

            <div
                class="progress-bar"
                id="progressBar"
            ></div>

        </div>


        <!-- =====================================
             QUESTION CARD
             ===================================== -->

        <section
            class="question-card"
            id="questionCard"
        >

            <p class="question-number">
                Challenge <span id="challengeNumber">1</span> of 5
            </p>

            <h2 id="questionText">
                Arrange the words to make a correct sentence.
            </h2>


            <!-- Selected sentence -->

            <div
                class="word-area"
                id="sentenceArea"
            >

                <span style="color:#718096;">
                    Click words below to build your sentence
                </span>

            </div>


            <!-- Available words -->

            <div
                class="word-area"
                id="wordOptions"
            >
            </div>


            <!-- Feedback -->

            <div
                class="feedback"
                id="feedback"
            ></div>


            <!-- Controls -->

            <button
                class="game-button check-button"
                id="checkButton"
            >
                ✅ Check Answer
            </button>

            <button
                class="game-button reset-button"
                id="resetButton"
            >
                🔄 Reset
            </button>

        </section>


        <!-- =====================================
             RESULT SCREEN
             ===================================== -->

        <section
            class="result-screen"
            id="resultScreen"
        >

            <div
                class="result-emoji"
                id="resultEmoji"
            >
                🎉
            </div>

            <h2 id="resultTitle">
                Level Complete!
            </h2>

            <p id="resultMessage">
                Great job, adventurer!
            </p>

            <button
                class="game-button check-button"
                id="nextButton"
            >
                🚀 Continue
            </button>

        </section>


        <!-- HOME -->

        <a
            href="map.html"
            class="game-button home-button"
        >
            🗺️ Back to Map
        </a>


    </main>


    <!-- =========================================
